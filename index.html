<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Контрольная: Пользователи</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f0f2f5;
      }
      h1 {
        color: #333;
      }
      #status {
        font-weight: bold;
        margin-bottom: 15px;
      }
      .error {
        color: #d9534f;
      }
      .users-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 15px;
      }
      .user-card {
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .user-card h3 {
        margin: 0 0 8px 0;
        color: #182b49;
        font-size: 18px;
      }
      .user-card p {
        margin: 4px 0;
        color: #555;
        font-size: 14px;
      }
      button {
        padding: 10px 16px;
        font-size: 15px;
        cursor: pointer;
        border-radius: 6px;
        border: none;
        background: #2980b9;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Список пользователей компании</h1>
    <button id="loadBtn">Загрузить пользователей</button>
    <p id="status"></p>
    <div id="usersContainer" class="users-list"></div>
    <script src="./main.js"></script>
  </body>
</html>
